name: vns-figures
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26
  - scipy=1.15
  - pandas=2.3
  - matplotlib=3.10
  - statsmodels=0.14
  - scikit-learn=1.7
  - pip:
      # EEG feature and plotting support
      - mne==1.9.0
      - autoreject==0.4.3
      - mne-icalabel==0.7.0
      - entropyhub==2.0
      - fathon==1.3.3.post1
      - hurst-exponent==0.1.1
      - emd-signal==1.6.4
      - powerlaw==1.5
      # JAX/Balloon–Windkessel rWW modelling
      - jax==0.6.2
      - jaxlib==0.6.2
      - scikit-optimize==0.10.2
      - brainpy==2.7.6
      - brainstate==0.2.10
      - braintools==0.1.8
      - brainunit==0.4.0
      - brainevent==0.0.6
